# Without this, Railway rebuilds and restarts the live backend on every push
# to master -- including frontend-only commits -- because the dashboard's
# Root Directory setting only controls the build context, not which changes
# trigger a deploy in the first place. That caused real (if brief) backend
# downtime windows on pushes that never touched backend/ at all, observed
# directly as 503s with nothing in Railway's own request logs at that
# moment. watchPatterns restricts deploys to changes actually under backend/.
#
# Paths here are relative to the repo root, not this file's own directory
# (Railway's own monorepo docs example: "/packages/backend/**").
[build]
watchPatterns = ["/backend/**"]
