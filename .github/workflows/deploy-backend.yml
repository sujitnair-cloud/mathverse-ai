name: Deploy backend to Railway

# Railway's own dashboard "watch paths" (Config-as-code watchPatterns) is
# deprecated for any service that never used it before 2026-08-28, which
# is this one -- the setting silently reverts on save and can't be relied
# on. Without it, Railway's default "deploy on any push to master" restarts
# the live backend on every commit, including frontend-only ones, causing
# a real (if brief) downtime window each time -- confirmed directly via a
# 503 on the live site with zero matching entries in Railway's own request
# logs at that timestamp. This workflow replaces Railway's built-in
# auto-deploy (disabled in the Railway dashboard) with GitHub's own native
# path filtering below, so only an actual backend/ change deploys it.
on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
  workflow_dispatch: {} # allows a manual test run from the Actions tab

jobs:
  test:
    # A quality gate that was previously entirely absent: every push to
    # backend/ deployed straight to production with zero automated check,
    # even though 130 passing tests already exist in the repo. A failing
    # step stops the job by default, so this blocks the deploy job below
    # (via `needs:`) whenever a real regression slips through.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        run: python -m unittest discover -s tests

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The shell-script installer (railway.com/install.sh) put the `railway`
      # binary somewhere not on PATH for the next step -- each step runs in
      # its own shell invocation, so a plain script-added PATH change doesn't
      # carry over. npm's global bin dir is already on PATH by default on
      # GitHub-hosted runners, so this avoids that problem entirely.
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      # Deploy from the repo root, not backend/ -- the service's own Root
      # Directory setting ("/backend") narrows the uploaded source itself.
      # cd'ing into backend/ first uploaded its *contents* as the source
      # root, so Railway then looked for a nonexistent backend/backend/ and
      # failed with "Root directory '/backend' was not found in the
      # deployed source" (confirmed via the actual failed build's logs).
      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service mathverse-ai --detach
